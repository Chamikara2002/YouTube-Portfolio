# Netlify Configuration for CHAMI G (COMMANDER WMC) Portfolio

[build]
  publish = "."

# Cache control and headers for high performance asset delivery
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
